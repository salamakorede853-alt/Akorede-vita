name: AKOREDE VITA CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: akorede-vita-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository, documentation, and prototype checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required project files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f CONTRIBUTING.md
          test -f docs/ARCHITECTURE.md
          test -f docs/ROADMAP.md
          test -f docs/UPSTREAM_AUDIT.md
          test -f app-prototype/index.html
          test -f app-prototype/README.md
          grep -q "AKOREDE VITA" README.md
          grep -q "GPL" docs/UPSTREAM_AUDIT.md
          grep -q "does not emulate" app-prototype/README.md
          echo "Required project and prototype files are present."

      - name: Check README local documentation links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          readme = Path("README.md").read_text(encoding="utf-8")
          links = re.findall(r"\\[[^]]+\\]\\(([^)]+)\\)", readme)
          missing = [
              link for link in links
              if not link.startswith(("https://", "http://", "#", "mailto:"))
              and not Path(link).exists()
          ]
          if missing:
              raise SystemExit("Missing README link targets: " + ", ".join(missing))
          print(f"Validated {len(links)} README links.")
          PY

      - name: Validate prototype HTML and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          source = Path("app-prototype/index.html").read_text(encoding="utf-8")
          class DocumentCheck(HTMLParser):
              def error(self, message):
                  raise RuntimeError(message)
          DocumentCheck().feed(source)
          scripts = re.findall(r"<script>(.*?)</script>", source, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit("Expected exactly one inline application script.")
          Path("/tmp/akorede-vita-prototype.js").write_text(scripts[0], encoding="utf-8")
          for required in ("Game library", "Controllers", "Settings", "Core integration pending"):
              if required not in source:
                  raise SystemExit(f"Missing expected prototype section: {required}")
          print("Prototype HTML structure and expected interface sections validated.")
          PY
          node --check /tmp/akorede-vita-prototype.js

  windows-toolchain-readiness:
    name: Windows C++ toolchain readiness
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Windows build tools are available
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git --version
          cmake --version
          $vswhere = "${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "Visual Studio Installer / vswhere was not found on the runner."
          }
          $installation = & $vswhere -latest -products * -property installationPath
          if (-not $installation) {
            throw "No Visual Studio installation was detected."
          }
          Write-Host "Visual Studio installation detected: $installation"
          Write-Host "This is a toolchain readiness check, not an emulator compilation."

  android-toolchain-readiness:
    name: Android toolchain readiness
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          if [ -z "${ANDROID_HOME:-}" ] && [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            echo "Android SDK environment is not preconfigured on this runner."
            exit 1
          fi
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -d "$SDK_ROOT"
          echo "Android SDK directory detected: $SDK_ROOT"
          echo "This is a toolchain readiness check, not an APK build."
