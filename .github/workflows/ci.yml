name: AKOREDE VITA CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: akorede-vita-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository and prototype checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required files
        run: |
          set -euo pipefail
          test -f README.md
          test -f CONTRIBUTING.md
          test -f docs/ARCHITECTURE.md
          test -f docs/ROADMAP.md
          test -f docs/UPSTREAM_AUDIT.md
          test -f app-prototype/index.html
          test -f native/shared/CMakeLists.txt
          test -f native/windows/CMakeLists.txt
          test -f native/android/app/build.gradle.kts
          echo "Project and native scaffold files are present."
      - name: Validate prototype JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path("app-prototype/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", source, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit("Expected exactly one inline script.")
          Path("/tmp/prototype.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/prototype.js

  shared-cpp-build:
    name: Build shared C++ bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure shared library
        run: cmake -S native/shared -B build/shared -DCMAKE_BUILD_TYPE=Release
      - name: Compile shared library
        run: cmake --build build/shared --config Release
      - name: Verify public status API
        run: |
          grep -q "av_engine_is_ready" native/shared/include/akorede_vita/engine_status.h
          grep -q "Emulator core not connected" native/shared/src/engine_status.cpp

  android-debug-build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Assemble debug APK
        working-directory: native/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: akorede-vita-android-debug
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows-desktop-build:
    name: Build Windows Qt application shell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtbase
      - name: Configure Windows application
        shell: pwsh
        run: cmake -S native/windows -B build/windows -DCMAKE_PREFIX_PATH="${{ steps.qt.outputs.qt-path }}"
      - name: Compile Windows application
        run: cmake --build build/windows --config Release
