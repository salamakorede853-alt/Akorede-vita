name: Vita3K platform build evidence

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  VITA3K_REF: c87e12578749d6267be9b0c669904fe22545b170
  BUILD_CONFIG: Release
  QT_VERSION: '6.11.0'

jobs:
  android:
    name: Android dependency resolution and build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VCPKG_ROOT: /usr/local/share/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
    steps:
      - name: Check out AKOREDE VITA tooling
        uses: actions/checkout@v4

      - name: Clone and pin Vita3K source and submodules
        shell: bash
        run: |
          git clone --no-checkout https://github.com/Vita3K/Vita3K.git upstream
          git -C upstream checkout --detach "$VITA3K_REF"
          if ! git -C upstream submodule update --init --recursive; then
            echo "SUBMODULE_INIT_FAILED=true" >> "$GITHUB_ENV"
            echo "Recursive submodule initialization failed; preserving partial evidence."
          fi
          test "$(git -C upstream rev-parse HEAD)" = "$VITA3K_REF"
          git -C upstream submodule status --recursive | tee evidence-android-submodules.txt

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vita3k-vcpkg-android-${{ env.VITA3K_REF }}-${{ hashFiles('upstream/vcpkg.json', 'upstream/CMakeLists.txt', 'upstream/cmake/**') }}
          restore-keys: |
            vita3k-vcpkg-android-

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-provider: basic
          validate-wrappers: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Resolve Android native dependencies
        working-directory: upstream
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          bash ./.ci/setup-android.sh 2>&1 | tee ../android-vcpkg-resolution.log

      - name: Capture Gradle dependency graph
        working-directory: upstream/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:dependencies 2>&1 | tee ../../android-gradle-dependencies.log

      - name: Build pinned Android target
        working-directory: upstream
        run: |
          bash ./.ci/build-android.sh ../android-build-output 2>&1 | tee ../android-build.log

      - name: Prepare per-ABI SBOM inputs and Android notices
        if: success()
        shell: bash
        run: |
          mkdir -p platform-evidence/android/sbom
          APK="$(find upstream/android/app/build/outputs -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          python3 scripts/prepare_platform_sbom.py \
            --apk "$APK" \
            --upstream-commit "$VITA3K_REF" \
            --sbom-input-dir platform-evidence/android/sbom-inputs \
            --notice-output platform-evidence/android/third-party-notices \
            --notice-root "$GITHUB_WORKSPACE/upstream"

      - name: Generate Android ARM64 CycloneDX SBOM
        if: success()
        uses: anchore/sbom-action@v0
        with:
          path: platform-evidence/android/sbom-inputs/android-arm64
          format: cyclonedx-json
          output-file: platform-evidence/android/sbom/android-arm64.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate Android x86_64 CycloneDX SBOM
        if: success()
        uses: anchore/sbom-action@v0
        with:
          path: platform-evidence/android/sbom-inputs/android-x86_64
          format: cyclonedx-json
          output-file: platform-evidence/android/sbom/android-x86_64.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Collect Android build evidence
        if: always()
        working-directory: upstream
        run: |
          mkdir -p ../platform-evidence/android
          cp ../android-vcpkg-resolution.log ../platform-evidence/android/ 2>/dev/null || true
          cp ../android-gradle-dependencies.log ../platform-evidence/android/ 2>/dev/null || true
          cp ../android-build.log ../platform-evidence/android/ 2>/dev/null || true
          cp ../evidence-android-submodules.txt ../platform-evidence/android/ 2>/dev/null || true
          git rev-parse HEAD > ../platform-evidence/android/upstream-commit.txt
          git submodule status --recursive > ../platform-evidence/android/submodule-status.txt
          vcpkg version > ../platform-evidence/android/vcpkg-version.txt 2>&1 || true
          vcpkg list > ../platform-evidence/android/vcpkg-installed-packages.txt 2>&1 || true
          if [ -d android/app/.cxx ]; then
            find android/app/.cxx -name CMakeCache.txt -type f -print | while read -r f; do
              dest="../platform-evidence/android/cmake-cache/$(dirname "$f")"
              mkdir -p "$dest"
              cp "$f" "$dest/"
            done
          fi
          find android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -printf '%p %s bytes\n' 2>/dev/null > ../platform-evidence/android/build-output-inventory.txt || true

      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vita3k-android-build-evidence-c87e125
          path: platform-evidence/android
          if-no-files-found: warn
          retention-days: 14

  package-sboms:
    name: Package platform SBOMs and third-party notices
    runs-on: ubuntu-latest
    needs: [android, windows]
    if: success()
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download Android build evidence
        uses: actions/download-artifact@v4
        with:
          name: vita3k-android-build-evidence-c87e125
          path: assembled/android

      - name: Download Windows build evidence
        uses: actions/download-artifact@v4
        with:
          name: vita3k-windows-build-evidence-c87e125
          path: assembled/windows

      - name: Assemble three SBOM reports and notices directory
        shell: bash
        run: |
          mkdir -p sbom-package/android-arm64 sbom-package/android-x86_64 sbom-package/windows-x64
          mkdir -p sbom-package/third-party-licence-notices/android sbom-package/third-party-licence-notices/windows
          cp assembled/android/sbom/android-arm64.cyclonedx.json sbom-package/android-arm64/
          cp assembled/android/sbom/android-x86_64.cyclonedx.json sbom-package/android-x86_64/
          cp assembled/windows/sbom/windows-x64.cyclonedx.json sbom-package/windows-x64/
          cp -R assembled/android/third-party-notices/. sbom-package/third-party-licence-notices/android/
          cp -R assembled/windows/third-party-notices/. sbom-package/third-party-licence-notices/windows/
          cat > sbom-package/README.md <<'EOF'
          # AKOREDE VITA platform SBOM package

          Contains separate CycloneDX JSON reports for Android ARM64, Android x86_64,
          and Windows x64, plus collected third-party licence/notice evidence.

          Android reports scan native shared libraries extracted from the APK for the
          corresponding ABI. Windows scans the built Vita3K.exe. Syft may not identify
          every statically linked component from binaries; the notices directory is
          an evidence collection, not a complete legal notice determination.

          Unresolved licence issues remain. This package does not grant redistribution
          clearance. See docs/PLATFORM_SBOM_AND_RELEASE_GATE.md in the repository.
          EOF
          find sbom-package -type f -print | sort

      - name: Upload combined SBOM and notices package
        uses: actions/upload-artifact@v4
        with:
          name: akorede-vita-platform-sboms-and-third-party-notices
          path: sbom-package
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows MSVC dependency resolution and build
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      VCPKG_ROOT: 'C:\vcpkg'
      VCPKG_DEFAULT_BINARY_CACHE: 'C:\vcpkg-binary-cache'
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - name: Clone and pin Vita3K source and submodules
        shell: bash
        run: |
          git clone --no-checkout https://github.com/Vita3K/Vita3K.git upstream
          git -C upstream checkout --detach "$VITA3K_REF"
          git -C upstream submodule update --init --recursive
          test "$(git -C upstream rev-parse HEAD)" = "$VITA3K_REF"
          git -C upstream submodule status --recursive | tee evidence-windows-submodules.txt

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vita3k-vcpkg-windows-${{ env.VITA3K_REF }}-${{ hashFiles('upstream/vcpkg.json', 'upstream/CMakeLists.txt', 'upstream/cmake/**') }}
          restore-keys: |
            vita3k-vcpkg-windows-

      - name: Set up MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Set up sccache compiler launcher
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba

      - name: Verify MSVC and sccache are available
        shell: pwsh
        run: |
          Get-Command cl.exe | Format-List Source
          sccache --version

      - name: Select supported Python for Qt installer
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtmultimedia
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          install-deps: false
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@f383b3c7d9658e881bd8ce8810057393bd934ee1

      - name: Resolve Windows native dependencies
        working-directory: upstream
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          .\.ci\setup-windows-msvc.ps1 -VcpkgTriplet 'x64-windows-static-md'

      - name: Build and test pinned Windows target
        working-directory: upstream
        shell: bash
        run: |
          bash ./.ci/build-desktop.sh --preset ci-windows-msvc --config "$BUILD_CONFIG" 2>&1 | tee ../windows-build.log

      - name: Collect Windows third-party notices
        if: success()
        shell: pwsh
        run: |
          python scripts/collect_windows_notices.py `
            --upstream upstream `
            --vcpkg-installed "$env:VCPKG_ROOT/installed/x64-windows-static-md" `
            --output platform-evidence/windows/third-party-notices `
            --commit "$env:VITA3K_REF"
          New-Item -ItemType Directory -Force -Path platform-evidence/windows/sbom | Out-Null

      - name: Generate Windows x64 CycloneDX SBOM
        if: success()
        uses: anchore/sbom-action@v0
        with:
          file: upstream/build/ci-windows-msvc/bin/Release/Vita3K.exe
          format: cyclonedx-json
          output-file: platform-evidence/windows/sbom/windows-x64.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Collect Windows build evidence
        if: always()
        working-directory: upstream
        shell: bash
        run: |
          mkdir -p ../platform-evidence/windows
          cp ../windows-build.log ../platform-evidence/windows/ 2>/dev/null || true
          cp ../evidence-windows-submodules.txt ../platform-evidence/windows/ 2>/dev/null || true
          git rev-parse HEAD > ../platform-evidence/windows/upstream-commit.txt
          git submodule status --recursive > ../platform-evidence/windows/submodule-status.txt
          cmake --version > ../platform-evidence/windows/cmake-version.txt 2>&1 || true
          vcpkg version > ../platform-evidence/windows/vcpkg-version.txt 2>&1 || true
          vcpkg list > ../platform-evidence/windows/vcpkg-packages.txt 2>&1 || true
          if [ -d build/ci-windows-msvc ]; then
            find build/ci-windows-msvc -name CMakeCache.txt -type f -exec cp --parents {} ../platform-evidence/windows/ \; 2>/dev/null || true
            find build/ci-windows-msvc -name '*.vcxproj' -type f | sort > ../platform-evidence/windows/project-files.txt
          fi

      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vita3k-windows-build-evidence-c87e125
          path: platform-evidence/windows
          if-no-files-found: warn
          retention-days: 14
